services:
  postgres:
    image: postgres:17-alpine
    container_name: crud-produtos-db
    environment:
      POSTGRES_DB: produtos
      POSTGRES_USER: produtos
      POSTGRES_PASSWORD: produtos
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U produtos -d produtos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados-postgres:
