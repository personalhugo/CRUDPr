spring:
  application:
    name: crud-produtos

  # Os valores padrão batem com o compose.yaml (ambiente de desenvolvimento).
  # Em produção, defina DB_URL, DB_USERNAME e DB_PASSWORD como variáveis de ambiente.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/produtos}
    username: ${DB_USERNAME:produtos}
    password: ${DB_PASSWORD:produtos}

  jpa:
    open-in-view: false
    hibernate:
      # O schema é gerenciado pelo Flyway; o Hibernate apenas confere se as entidades batem com ele.
      ddl-auto: validate

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # Mensagens de validação sempre em português, independente do Accept-Language.
  web:
    locale: pt_BR
    locale-resolver: fixed

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
